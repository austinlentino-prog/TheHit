<!DOCTYPE html>
<html>
<head>
  <title>TheHit</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#1a1a3d;
      color:white;
    }

    header{
      background:#2c2cff;
      padding:20px;
      text-align:center;
      font-size:40px;
      font-weight:bold;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .postbox{
      background:#2a2a4d;
      padding:20px;
      border-radius:10px;
      margin-bottom:20px;
    }

    input{
      width:80%;
      padding:10px;
      border:none;
      border-radius:5px;
    }

    button{
      padding:10px 20px;
      background:#5865F2;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    .post{
      background:#2a2a4d;
      padding:15px;
      border-radius:10px;
      margin-top:10px;
    }

    .sidebar{
      margin-top:20px;
      display:flex;
      gap:10px;
    }

    .card{
      background:#2a2a4d;
      padding:15px;
      border-radius:10px;
      flex:1;
    }
  </style>
</head>
<body>

<header>
  THEHIT
</header>

<div class="container">

  <div class="postbox">
    <h2>Create Post</h2>
    <input id="postInput" placeholder="What's happening?">
    <button onclick="makePost()">Post</button>
  </div>

  <div id="feed"></div>

  <div class="sidebar">
    <div class="card">
      <h3>🔥 Trending</h3>
      <p>#TheHit</p>
      <p>#Gaming</p>
      <p>#SchoolLife</p>
    </div>

    <div class="card">
      <h3>👤 Profile</h3>
      <p>Austin</p>
      <p>Founder of TheHit</p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
